<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>流光聊天室</title>


<style>

/* ========================================
   基本設定（淺色主題）
======================================== */

* {

    box-sizing: border-box;

    -webkit-tap-highlight-color: transparent;

}

html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    background: #f0ede8;

    color: #222;

    font-family:
        "Courier New",
        "Noto Sans TC",
        monospace;

}

body {

    display: flex;

    justify-content: center;

    align-items: center;

}

button,
input,
select {

    font-family: inherit;

}

button:focus,
input:focus,
select:focus {

    outline: none;

}


/* ========================================
   電腦版網站
======================================== */

#site {

    width: min(92vw, 1200px);

    aspect-ratio: 4 / 3;

    max-height: 92vh;

    background: #f5f2ee;

    border: 1px solid #ccc;

    position: relative;

    overflow: hidden;

}


/* ========================================
   登入畫面（淺色）
======================================== */

#login-screen {

    width: 100%;
    height: 100%;

    display: flex;

    justify-content: center;
    align-items: center;

    background: #f5f2ee;

    position: relative;

}


/* ========================================
   登入視窗
======================================== */

.login-window {

    width: min(460px, 85vw);

    background:
        linear-gradient(
            135deg,
            #ffffff 0%,
            #f8f6f2 55%,
            #f0ede8 100%
        );

    border: 1px solid #bbb;

    padding: 45px 40px;

    box-shadow:
        4px 4px 0 #ccc,
        0 0 30px rgba(0, 0, 0, 0.06);

    position: relative;

    overflow: hidden;

}


/* ========================================
   掃描線（登入，淺色版）
======================================== */

.login-window::before {

    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    background:
        repeating-linear-gradient(
            to bottom,
            rgba(0, 0, 0, 0.015) 0px,
            rgba(0, 0, 0, 0.015) 1px,
            transparent 1px,
            transparent 4px
        );

    z-index: 10;

}


/* ========================================
   Logo（登入）
======================================== */

.logo-area {

    display: flex;

    flex-direction: column;

    align-items: center;

    margin-bottom: 42px;

    position: relative;

    z-index: 2;

}

.logo-image {

    width: 105px;
    height: 105px;

    object-fit: contain;

    display: block;

    filter:
        drop-shadow(
            2px 2px 0
            rgba(0, 168, 255, 0.20)
        )
        drop-shadow(
            -2px -1px 0
            rgba(255, 45, 170, 0.12)
        );

}

.logo {

    text-align: center;

    font-size: 22px;

    letter-spacing: 0.18em;

    color: #333;

    margin-top: 17px;

    font-weight: 700;

    text-shadow:
        1px 0 rgba(0, 168, 255, 0.15),
        -1px 0 rgba(255, 45, 170, 0.10);

}

.logo-sub {

    text-align: center;

    color: #888;

    font-size: 12px;

    margin-top: 7px;

}


/* ========================================
   登入標籤（淺色）
======================================== */

.login-label {

    display: block;

    color: #555;

    font-size: 12px;

    margin-bottom: 7px;

    letter-spacing: 1px;

    position: relative;

    z-index: 2;

}


/* ========================================
   登入輸入（淺色）
======================================== */

.login-input {

    width: 100%;

    height: 40px;

    padding: 8px 10px;

    background: #ffffff;

    border: 1px solid #bbb;

    color: #222;

    margin-bottom: 20px;

    position: relative;

    z-index: 2;

}

.login-input:focus {

    border-color: #888;

    box-shadow:
        0 0 0 2px
        rgba(0, 0, 0, 0.06);

}


/* ========================================
   登入按鈕（淺色）
======================================== */

.login-button,
.guest-button {

    width: 100%;

    height: 40px;

    cursor: pointer;

    position: relative;

    z-index: 2;

    font-weight: 600;

}

.login-button {

    background:
        linear-gradient(
            180deg,
            #ffffff,
            #e8e4de
        );

    color: #333;

    border: 1px solid #aaa;

    box-shadow:
        3px 3px 0 #ccc;

}

.login-button:active {

    transform: translate(2px, 2px);

    box-shadow:
        1px 1px 0 #ccc;

}

.guest-button {

    margin-top: 12px;

    background:
        linear-gradient(
            180deg,
            #f5f2ee,
            #e0dcd6
        );

    color: #555;

    border: 1px solid #bbb;

    box-shadow:
        2px 2px 0 #ccc;

}

.guest-button:active {

    transform: translate(1px, 1px);

    box-shadow:
        1px 1px 0 #ccc;

}


/* ========================================
   登入分隔（淺色）
======================================== */

.login-divider {

    display: flex;

    align-items: center;

    gap: 10px;

    margin: 28px 0;

    position: relative;

    z-index: 2;

}

.login-divider::before,
.login-divider::after {

    content: "";

    flex: 1;

    height: 1px;

    background: #ccc;

}

.login-divider span {

    color: #999;

    font-size: 11px;

    white-space: nowrap;

}


/* ========================================
   登入提示（淺色）
======================================== */

.login-notice {

    margin-top: 25px;

    padding-top: 15px;

    border-top: 1px solid #ddd;

    text-align: center;

    color: #999;

    font-size: 11px;

    position: relative;

    z-index: 2;

}


#guest-name-window {

    display: none;

}


/* ========================================
   聊天室（淺色）
======================================== */

#chat-screen {

    display: none;

    width: 100%;
    height: 100%;

    flex-direction: column;

    background: #f5f2ee;

    color: #222;

}


/* ========================================
   上方（淺色）
======================================== */

.top-bar {

    height: 55px;

    flex-shrink: 0;

    border-bottom: 1px solid #ddd;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 18px;

    background: #faf8f5;

}

.top-logo {

    display: flex;
    align-items: center;

}

.top-logo-image {

    height: 36px;
    width: auto;
    display: block;
    object-fit: contain;

}

.top-right {
    display: flex;
    align-items: center;
    gap: 16px;
}

.user-status {

    color: #555;

    font-size: 12px;

}

.user-name {

    color: #222;

}

.visitor-counter {
    background: #ffffff;
    border: 1px solid #ddd;
    padding: 4px 12px;
    border-radius: 3px;
    font-size: 12px;
    color: #555;
    display: flex;
    align-items: center;
    gap: 6px;
}

.visitor-counter img {
    vertical-align: middle;
}


/* ========================================
   主體（淺色）
======================================== */

.chat-layout {

    flex: 1;

    min-height: 0;

    display: flex;

}

.chat-main {

    flex: 1;

    min-width: 0;

    min-height: 0;

    display: flex;

    flex-direction: column;

    border-right: 1px solid #ddd;

}


/* ========================================
   聊天室標題（淺色）
======================================== */

.room-header {

    height: 55px;

    flex-shrink: 0;

    border-bottom: 1px solid #ddd;

    padding: 10px 16px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    background: #faf8f5;

}

.room-name {

    color: #333;

    font-size: 16px;

    font-weight: 600;

}

.room-description {

    color: #888;

    font-size: 11px;

}


/* ========================================
   訊息區（淺色）
======================================== */

.messages {

    flex: 1;

    min-height: 0;

    overflow-y: auto;

    overflow-x: hidden;

    padding: 18px;

    -webkit-overflow-scrolling: touch;

    overscroll-behavior: contain;

    background: #fcfaf7;

}

.message {

    margin-bottom: 17px;

    line-height: 1.65;

    font-weight: 600;

}

.message-meta {

    font-size: 12px;

    color: #333;

    margin-bottom: 3px;

    font-weight: 600;

}

.message-user {

    color: #222;

    font-weight: 600;

}

.message-target-word {

    color: #7a5ea7;

    font-weight: 600;

}

.message-target-name {

    color: #222;

    font-weight: 600;

}

.message-text {

    font-size: 14px;

    word-break: break-word;

    font-weight: 600;

}

.message-private {

    color: #b08870;

    font-weight: 600;

}

.message-system {

    color: #2d8f4a;

    font-size: 12px;

    text-align: center;

    font-weight: normal;

    margin: 10px 0;

}


/* ========================================
   輸入區（淺色）
======================================== */

.input-area {

    flex-shrink: 0;

    border-top: 1px solid #ddd;

    padding: 10px;

    background: #faf8f5;

}

.tools {

    display: flex;

    align-items: center;

    gap: 6px;

    margin-bottom: 8px;

}

.tool-button {

    width: 34px;

    height: 28px;

    background: #ffffff;

    border: 1px solid #ddd;

    color: #555;

    cursor: pointer;

    font-weight: 600;

}

.tool-button:hover {

    background: #f0ede8;

}

.color-label {

    color: #555;

    font-size: 11px;

    margin-left: 5px;

    white-space: nowrap;

}

.color-select {

    height: 28px;

    max-width: 150px;

    background: #ffffff;

    border: 1px solid #ddd;

    color: #333;

    padding: 0 5px;

    font-weight: 600;

}

.input-row {

    display: flex;

    gap: 8px;

}

.message-input {

    flex: 1;

    min-width: 0;

    height: 42px;

    background: #ffffff;

    border: 1px solid #ddd;

    padding: 8px 10px;

    color: #222;

    font-size: 14px;

    font-weight: 600;

}

.message-input:focus {

    border-color: #888;

}

.send-button {

    width: 80px;

    flex-shrink: 0;

    background: #e8e4de;

    color: #333;

    border: 1px solid #ccc;

    cursor: pointer;

    font-weight: 600;

}

.send-button:hover {

    background: #ddd8d0;

}


/* ========================================
   成員區（淺色）
======================================== */

.member-panel {

    width: 230px;

    flex-shrink: 0;

    display: flex;

    flex-direction: column;

    min-height: 0;

    background: #faf8f5;

}


/* ========================================
   管理員（淺色）
======================================== */

.admin-panel {

    flex-shrink: 0;

    border-bottom: none;

    padding: 10px 12px 6px 12px;

}

.admin-title {

    color: #888;

    font-size: 10px;

    margin-bottom: 8px;

}

.admin-member {

    display: flex;

    align-items: center;

    gap: 8px;

    padding: 5px 3px;

    font-size: 12px;

    font-weight: 600;

}

.admin-gif {

    width: 18px;

    height: 18px;

    object-fit: contain;

    flex-shrink: 0;

}

.admin-name {

    color: #333;

}

.admin-name.offline {

    color: #aaa;

}


/* ========================================
   分隔線（動態圖）
======================================== */

.admin-divider {
    text-align: center;
    padding: 4px 0 8px 0;
    border-bottom: 1px solid #ddd;
    margin-bottom: 4px;
}

.admin-divider img {
    width: 60px;
    height: auto;
    opacity: 0.5;
}


/* ========================================
   成員標題（淺色）
======================================== */

.member-header {

    height: 55px;

    flex-shrink: 0;

    border-bottom: 1px solid #ddd;

    display: flex;

    align-items: center;

    padding: 0 15px;

    color: #888;

    font-size: 12px;

    font-weight: 600;

}

.member-list {

    flex: 1;

    min-height: 0;

    overflow-y: auto;

    padding: 12px;

}

.member-group {

    margin-bottom: 20px;

}

.member-group-title {

    color: #888;

    font-size: 10px;

    margin-bottom: 8px;

}

.member {

    display: flex;

    align-items: center;

    gap: 8px;

    padding: 6px 4px;

    font-size: 12px;

    color: #333;

    cursor: pointer;

    font-weight: 600;

}

.member:hover {

    background: #f0ede8;

}

.status-dot {

    width: 7px;

    height: 7px;

    flex-shrink: 0;

    border-radius: 50%;

    border: 1px solid #ccc;

}

.status-online {

    background: #66cc66;

}

.status-offline {

    background: transparent;

}


/* ========================================
   聊天室切換（淺色）
======================================== */

.room-switcher {

    flex-shrink: 0;

    border-top: 1px solid #ddd;

    padding: 10px;

}

.room-switcher-title {

    font-size: 10px;

    color: #888;

    margin-bottom: 7px;

}

.room-buttons {

    display: flex;

    gap: 5px;

}

.room-button {

    flex: 1;

    height: 28px;

    background: #f5f2ee;

    color: #888;

    border: 1px solid #ddd;

    cursor: pointer;

    font-weight: 600;

}

.room-button.active {

    color: #333;

    border-color: #aaa;

    background: #e8e4de;

}

.room-button:hover {

    background: #ede9e4;

}


/* ========================================
   捲軸（淺色）
======================================== */

::-webkit-scrollbar {

    width: 7px;

    height: 7px;

}

::-webkit-scrollbar-track {

    background: #f5f2ee;

}

::-webkit-scrollbar-thumb {

    background: #ccc;

}

::-webkit-scrollbar-thumb:hover {

    background: #bbb;

}


/* ========================================
   手機版
======================================== */

@media (max-width: 700px) {

    html,
    body {

        width: 100%;

        height: 100%;

        min-height: 100%;

    }

    body {

        display: block;

        overflow: hidden;

    }

    #site {

        width: 100%;

        height: 100dvh;

        min-height: 100dvh;

        max-height: none;

        aspect-ratio: auto;

        border: none;

        overflow: hidden;

    }

    .chat-layout {

        flex: 1;

        min-height: 0;

        height: calc(
            100dvh - 55px
        );

        flex-direction: row;

    }

    .chat-main {

        flex: 3;

        min-height: 0;

        height: auto;

        border-right: 1px solid #ddd;

    }

    .messages {

        flex: 1;

        min-height: 0;

        overflow-y: auto;

        overflow-x: hidden;

        padding: 12px;

        -webkit-overflow-scrolling: touch;

        overscroll-behavior: contain;

    }

    .input-area {

        flex-shrink: 0;

        padding:
            7px
            8px
            calc(
                7px +
                env(
                    safe-area-inset-bottom
                )
            );

    }

    .tools {

        overflow-x: auto;

        white-space: nowrap;

        scrollbar-width: none;

        margin-bottom: 7px;

    }

    .tools::-webkit-scrollbar {

        display: none;

    }

    .tool-button {

        flex-shrink: 0;

    }

    .color-label {

        flex-shrink: 0;

    }

    .color-select {

        flex-shrink: 0;

        max-width: 140px;

    }

    .message-input {

        height: 40px;

        font-size: 14px;

    }

    .send-button {

        width: 60px;

        height: 40px;

    }

    .member-panel {

        width: 140px;

        flex-shrink: 0;

        height: auto;

        border-top: none;

        border-left: 1px solid #ddd;

    }

    .admin-panel {

        height: auto;

        padding: 6px 8px;

        overflow: visible;

        white-space: normal;

        display: block;

    }

    .admin-title {

        margin-bottom: 4px;

        font-size: 9px;

    }

    .admin-member {

        display: flex;

        padding: 3px 2px;

        font-size: 10px;

        gap: 5px;

    }

    .admin-gif {

        width: 14px;

        height: 14px;

    }

    .admin-divider img {
        width: 40px;
    }

    .member-header {

        height: 28px;

        flex-shrink: 0;

        padding: 0 8px;

        font-size: 10px;

    }

    .member-list {

        height: auto;

        flex: 1;

        display: block;

        padding: 6px 8px;

        overflow-y: auto;

        overflow-x: hidden;

        white-space: normal;

        scrollbar-width: thin;

    }

    .member-list::-webkit-scrollbar {

        display: block;

        width: 4px;

    }

    .member-group {

        display: block;

        margin: 0 0 8px 0;

    }

    .member-group-title {

        display: block;

        font-size: 8px;

    }

    .member {

        display: flex;

        flex-shrink: 0;

        padding: 4px 3px;

        height: auto;

        font-size: 10px;

        gap: 5px;

    }

    .status-dot {

        width: 5px;

        height: 5px;

    }

    .room-switcher {

        height: auto;

        padding: 6px 8px;

    }

    .room-switcher-title {

        display: block;

        font-size: 9px;

        color: #888;

        margin-bottom: 4px;

    }

    .room-buttons {

        height: auto;

    }

    .room-button {

        height: 24px;

        font-size: 10px;

    }

    .login-window {

        width: 86vw;

        max-width: 460px;

        padding: 35px 28px;

    }

    .logo-image {

        width: 80px;

        height: 80px;

    }

    .logo {

        font-size: 18px;

    }

    .top-logo-image {
        height: 28px;
    }

    .top-right {
        gap: 8px;
    }

    .visitor-counter {
        font-size: 10px;
        padding: 2px 8px;
    }

    .user-status {
        font-size: 10px;
    }

}


/* ========================================
   更窄手機
======================================== */

@media (max-width: 450px) {

    .message {

        margin-bottom: 12px;

    }

    .message-text {

        font-size: 13px;

    }

    .message-meta {

        font-size: 11px;

    }

    .input-area {

        padding-left: 6px;

        padding-right: 6px;

    }

    .color-label {

        font-size: 10px;

    }

    .color-select {

        max-width: 110px;

        font-size: 10px;

    }

    .send-button {

        width: 55px;

    }

    .login-window {

        padding:
            30px
            22px;

    }

    .member-panel {
        width: 110px;
    }

    .top-right {
        gap: 5px;
    }

    .visitor-counter {
        font-size: 8px;
        padding: 2px 5px;
    }

    .visitor-counter img {
        max-width: 50px;
        height: auto;
    }

    .user-status {
        font-size: 9px;
    }

}

</style>

</head>


<body>


<div id="site">


<!-- ========================================
     登入
======================================== -->

<div id="login-screen">


    <div
        class="login-window"
        id="login-main"
    >

        <div class="logo-area">

            <img
                class="logo-image"
                src="https://raw.githubusercontent.com/shelly49311-source/-/refs/heads/main/%E7%84%A1%E6%A8%99%E9%A1%8C12_20260826175005.png"
                alt="流光聊天室"
            >

            <div class="logo">
                -流光聊天室-
            </div>

        </div>


        <label class="login-label">
            帳號
        </label>


        <input
            class="login-input"
            id="login-account"
            type="text"
        >


        <label class="login-label">
            密碼
        </label>


        <input
            class="login-input"
            id="login-password"
            type="password"
        >


        <button
            class="login-button"
            onclick="loginUnavailable()"
        >
            登入
        </button>


        <div class="login-divider">

            <span>
                ── 或 ──
            </span>

        </div>


        <button
            class="guest-button"
            onclick="showGuestLogin()"
        >
            訪客登入
        </button>


        <div class="login-notice">
            目前暫不開放註冊
        </div>


    </div>


    <!-- ====================================
         訪客登入
    ==================================== -->

    <div
        class="login-window"
        id="guest-name-window"
    >

        <div class="logo-area">

            <img
                class="logo-image"
                src="https://raw.githubusercontent.com/shelly49311-source/-/refs/heads/main/%E7%84%A1%E6%A8%99%E9%A1%8C12_20260826175005.png"
                alt="流光聊天室"
            >

            <div class="logo">
                -流光聊天室-
            </div>

        </div>


        <label class="login-label">
            請輸入你的名稱
        </label>


        <input
            class="login-input"
            id="guest-name"
            type="text"
            maxlength="20"
            placeholder="輸入名稱"
        >


        <label class="login-label">
            性別
        </label>


        <select
            class="login-input"
            id="guest-gender"
        >

            <option value="">
                請選擇
            </option>

            <option value="male">
                男
            </option>

            <option value="female">
                女
            </option>

        </select>


        <button
            class="login-button"
            onclick="enterGuest()"
        >
            進入
        </button>


        <button
            class="guest-button"
            onclick="backToLogin()"
        >
            返回
        </button>


    </div>


</div>


<!-- ========================================
     聊天室
======================================== -->

<div id="chat-screen">


    <div class="top-bar">

        <div class="top-logo">
            <img

            "請輸入名稱。"
        );

        return;

    }

    if (gender === "") {

        alert(
            "請選擇性別。"
        );

        return;

    }

    currentUser = name;

    currentGender = gender;

    hasEnteredChat = true;

    document.getElementById(
        "login-screen"
    ).style.display = "none";

    document.getElementById(
        "chat-screen"
    ).style.display = "flex";

    document.getElementById(
        "display-name"
    ).textContent =
        "訪客_" + currentUser;

    // 顯示歡迎訊息
    const welcomeMessage = {
        type: "system",
        text: "歡迎 訪客_" + currentUser + " 進入聊天室"
    };

    // 加入當前房間的訊息中
    roomMessages[currentRoom].push(welcomeMessage);

    initializeRooms();

}


/* ========================================
   初始化聊天室
======================================== */

function initializeRooms() {

    currentRoom = 1;

    for (
        let roomNumber = 1;
        roomNumber <= 3;
        roomNumber++
    ) {

        roomMessages[roomNumber] = [];

        shownAutomaticMessages[
            roomNumber
        ].clear();

    }

    renderRoom();

    renderMembers();

    if (
        hasEnteredChat
    ) {

        startLiveChat();

        startPrivateMessages();

    }

}


/* ========================================
   顯示聊天室
======================================== */

function renderRoom() {

    const room =
        rooms[currentRoom];

    document.getElementById(
        "room-name"
    ).textContent =
        room.name;

    document.getElementById(
        "room-description"
    ).textContent =
        room.description;

    const container =
        document.getElementById(
            "messages"
        );

    container.innerHTML = "";

    const messages =
        roomMessages[
            currentRoom
        ];

    messages.forEach(
        message => {

            const element =
                createMessageElement(
                    message
                );

            container.appendChild(
                element
            );

        }
    );

    container.scrollTop =
        container.scrollHeight;

    const buttons =
        document.querySelectorAll(
            ".room-button"
        );

    buttons.forEach(
        (
            button,
            index
        ) => {

            if (
                index + 1 ===
                currentRoom
            ) {

                button.classList.add(
                    "active"
                );

            } else {

                button.classList.remove(
                    "active"
                );

            }

        }
    );

}


/* ========================================
   建立訊息（包含冒號）
======================================== */

function createMessageElement(
    message
) {

    const element =
        document.createElement(
            "div"
        );

    element.className =
        "message";

    const meta =
        document.createElement(
            "div"
        );

    meta.className =
        "message-meta";

    const text =
        document.createElement(
            "div"
        );

    text.className =
        "message-text";

    if (message.type === "system") {

        // 系統訊息（綠色，置中）
        element.className =
            "message message-system";

        text.textContent =
            message.text;

        text.style.color =
            "#2d8f4a";

        text.style.textAlign =
            "center";

        element.appendChild(
            text
        );

        return element;
    }

    if (
        message.type ===
        "private"
    ) {

        meta.className =
            "message-meta message-private";

        meta.textContent =
            message.user +
            " 私訊：";

    }

    else if (
        message.from &&
        message.to
    ) {

        const from =
            document.createElement(
                "span"
            );

        from.className =
            "message-user";

        from.textContent =
            message.from;

        const targetWord =
            document.createElement(
                "span"
            );

        targetWord.className =
            "message-target-word";

        targetWord.textContent =
            " → ";

        const targetName =
            document.createElement(
                "span"
            );

        targetName.className =
            "message-target-name";

        targetName.textContent =
            message.to;

        meta.appendChild(
            from
        );

        meta.appendChild(
            targetWord
        );

        meta.appendChild(
            targetName
        );

        // 加上冒號
        const colon =
            document.createTextNode(
                "："
            );

        meta.appendChild(
            colon
        );

    }

    else {

        const user =
            document.createElement(
                "span"
            );

        user.className =
            "message-user";

        user.textContent =
            message.user;

        meta.appendChild(
            user
        );

        // 加上冒號
        const colon =
            document.createTextNode(
                "："
            );

        meta.appendChild(
            colon
        );

    }

    text.textContent =
        message.text;

    text.style.color =
        message.color ||
        "#222";

    element.appendChild(
        meta
    );

    element.appendChild(
        text
    );

    return element;

}


/* ========================================
   顯示訊息
======================================== */

function addMessageToScreen(
    roomNumber,
    message,
    save = true
) {

    if (
        save
    ) {

        roomMessages[
            roomNumber
        ].push(
            message
        );

    }

    if (
        roomNumber !==
        currentRoom
    ) {

        return;

    }

    const container =
        document.getElementById(
            "messages"
        );

    const element =
        createMessageElement(
            message
        );

    container.appendChild(
        element
    );

    container.scrollTop =
        container.scrollHeight;

}


/* ========================================
   切換聊天室
======================================== */

function changeRoom(
    roomNumber
) {

    currentRoom =
        roomNumber;

    renderRoom();

    renderMembers();

    // 切換房間後強制觸發一次自動聊天
    if (hasEnteredChat) {
        if (liveChatTimer !== null) {
            clearTimeout(liveChatTimer);
            liveChatTimer = null;
        }
        scheduleNextMessage();
    }

}


/* ========================================
   管理員
======================================== */

function renderAdministrators() {

    const panel =
        document.getElementById(
            "admin-panel"
        );

    panel.innerHTML = "";

    const adminList =
        administrators[
            currentRoom
        ];

    adminList.forEach(
        admin => {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "admin-member";

            const image =
                document.createElement(
                    "img"
                );

            image.className =
                "admin-gif";

            image.src =
                adminGif;

            image.alt =
                "";

            const name =
                document.createElement(
                    "span"
                );

            name.className =
                "admin-name";

            if (
                !admin.online
            ) {

                name.classList.add(
                    "offline"
                );

            }

            name.textContent =
                "【管理員】" +
                admin.name;

            item.appendChild(
                image
            );

            item.appendChild(
                name
            );

            panel.appendChild(
                item
            );

        }
    );

}


/* ========================================
   成員
======================================== */

function renderMembers() {

    renderAdministrators();

    const list =
        document.getElementById(
            "member-list"
        );

    list.innerHTML = "";

    const members =
        rooms[
            currentRoom
        ].members;

    const onlineMembers =
        members.filter(
            member =>
                member[1] === true
        );

    createMemberGroup(
        list,
        "ONLINE",
        onlineMembers
    );

    const visitorNames =
        visitors[
            currentRoom
        ];

    const visitorArray =
        visitorNames.map(
            name => [
                "訪客_" + name,
                true
            ]
        );

    createMemberGroup(
        list,
        "VISITOR",
        visitorArray
    );

}


function createMemberGroup(
    parent,
    title,
    memberArray
) {

    if (
        memberArray.length === 0
    ) {

        return;

    }

    const group =
        document.createElement(
            "div"
        );

    group.className =
        "member-group";

    const groupTitle =
        document.createElement(
            "div"
        );

    groupTitle.className =
        "member-group-title";

    groupTitle.textContent =
        title;

    group.appendChild(
        groupTitle
    );

    memberArray.forEach(
        memberData => {

            const member =
                document.createElement(
                    "div"
                );

            member.className =
                "member";

            const dot =
                document.createElement(
                    "span"
                );

            dot.className =
                "status-dot " +
                (
                    memberData[1]
                        ? "status-online"
                        : "status-offline"
                );

            const name =
                document.createElement(
                    "span"
                );

            name.textContent =
                memberData[0];

            member.appendChild(
                dot
            );

            member.appendChild(
                name
            );

            member.addEventListener(
                "click",
                function() {

                    memberClicked(
                        memberData[0]
                    );

                }
            );

            group.appendChild(
                member
            );

        }
    );

    parent.appendChild(
        group
    );

}


/* ========================================
   點擊成員
======================================== */

function memberClicked(
    name
) {

    if (
        name ===
        "Airly"
    ) {

        alert(
            "Airly\n\n" +
            "狀態：離線"
        );

    }

}


/* ========================================
   玩家發送
======================================== */

function sendMessage() {

    const input =
        document.getElementById(
            "message-input"
        );

    const messageText =
        input.value.trim();

    if (
        messageText === ""
    ) {

        return;

    }

    const color =
        document
            .getElementById(
                "text-color"
            )
            .value;

    const playerMessage = {

        user:
            "訪客_" + currentUser,

        text:
            messageText,

        color:
            color

    };

    addMessageToScreen(
        currentRoom,
        playerMessage
    );

    input.value = "";

    input.focus();

}


/* ========================================
   表情
======================================== */

function insertEmoji(
    emoji
) {

    const input =
        document.getElementById(
            "message-input"
        );

    input.value += emoji;

    input.focus();

}


/* ========================================
   顏色
======================================== */

document
    .getElementById(
        "text-color"
    )
    .addEventListener(
        "change",
        function() {

            document
                .getElementById(
                    "message-input"
                )
                .style.color =
                this.value;

        }
    );


/* ========================================
   Enter
======================================== */

document
    .getElementById(
        "message-input"
    )
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key ===
                "Enter"
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );


/* ========================================
   自動聊天
======================================== */

let liveChatTimer = null;


function startLiveChat() {

    if (
        liveChatTimer !== null
    ) {

        clearTimeout(
            liveChatTimer
        );

    }

    if (
        !hasEnteredChat
    ) {

        return;

    }

    scheduleNextMessage();

}


function scheduleNextMessage() {

    if (
        !hasEnteredChat
    ) {

        return;

    }

    const delay =
        Math.floor(
            Math.random() *
            9000
        ) + 4000;

    liveChatTimer =
        setTimeout(
            function() {

                if (
                    !hasEnteredChat
                ) {

                    return;

                }

                addAutomaticMessage();

                scheduleNextMessage();

            },
            delay
        );

}


/* ========================================
   找目前時段的 chatDatabase
======================================== */

function getChatDatabasePeriod() {

    const hour =
        new Date().getHours();

    if (
        hour >= 6 &&
        hour < 9
    ) {

        return "morning";

    }

    if (
        hour >= 9 &&
        hour < 12
    ) {

        return "day";

    }

    if (
        hour >= 12 &&
        hour < 14
    ) {

        return "noon";

    }

    if (
        hour >= 14 &&
        hour < 20
    ) {

        return "afternoon";

    }

    if (
        hour >= 20 &&
        hour < 23
    ) {

        return "evening";

    }

    if (
        hour >= 23 ||
        hour < 3
    ) {

        return "late";

    }

    return "dead";

}


/* ========================================
   chatDatabase → 訊息
======================================== */

function playChatFragment(
    fragment
) {

    if (
        !fragment ||
        !fragment.lines ||
        fragment.lines.length === 0
    ) {

        return;

    }

    let index = 0;

    function nextLine() {

        if (
            index >=
            fragment.lines.length
        ) {

            return;

        }

        const line =
            fragment.lines[
                index
            ];

        const message = {

            user:
                line.speaker,

            text:
                line.text,

            color:
                getNPCColor(
                    line.speaker
                )

        };

        addMessageToScreen(
            currentRoom,
            message
        );

        index++;

        if (
            index <
            fragment.lines.length
        ) {

            const delay =
                Math.floor(
                    Math.random() *
                    3500
                ) + 1800;

            setTimeout(
                nextLine,
                delay
            );

        }

    }

    nextLine();

}


/* ========================================
   NPC 顏色
======================================== */

function getNPCColor(
    speaker
) {

    const colorMap = {

        "小麥": "#ffd84d",

        "阿哲": "#ffd84d",

        "檸檬汽水": "#d8899b",

        "颱風天": "#f27a3d",

        "左邊轉彎": "#b6a6d9",

        "七喜": "#ffd84d",

        "小海": "#7fafc4"

    };

    return (
        colorMap[
            speaker
        ] ||
        "#ddd"
    );

}


/* ========================================
   自動訊息（含訪客發言）
======================================== */

function addAutomaticMessage() {

    if (!hasEnteredChat) {
        return;
    }

    const period = getChatDatabasePeriod();

    // 先從 NPC 資料庫選取
    const databaseFragments = chatDatabase.filter(fragment => {

        if (fragment.room !== currentRoom) {
            return false;
        }

        if (period === "dead") {
            return fragment.id.startsWith("dead");
        }

        return fragment.id.startsWith(period);
    });

    // 從訪客資料庫選取
    const visitorFragments = visitorChatDatabase.filter(fragment => {
        return fragment.room === currentRoom;
    });

    // 合併兩個資料庫（NPC + 訪客）
    const allFragments = databaseFragments.concat(visitorFragments);

    if (allFragments.length === 0) {
        return;
    }

    // 過濾已播放過的片段
    const available = allFragments.filter(fragment => {
        return !shownAutomaticMessages[currentRoom].has(fragment.id);
    });

    // 如果所有片段都已播放過，清空紀錄重新開始
    if (available.length === 0) {
        shownAutomaticMessages[currentRoom].clear();
        const resetAvailable = allFragments.filter(fragment => {
            return !shownAutomaticMessages[currentRoom].has(fragment.id);
        });
        if (resetAvailable.length === 0) {
            return;
        }
        const randomIndex = Math.floor(Math.random() * resetAvailable.length);
        const selected = resetAvailable[randomIndex];
        shownAutomaticMessages[currentRoom].add(selected.id);
        playChatFragment(selected);
        return;
    }

    const randomIndex = Math.floor(Math.random() * available.length);
    const selected = available[randomIndex];
    shownAutomaticMessages[currentRoom].add(selected.id);
    playChatFragment(selected);
}


/* ========================================
   時間
======================================== */

function getTimePeriod() {

    const hour =
        new Date().getHours();

    if (
        hour >= 6 &&
        hour < 18
    ) {

        return "day";

    }

    return "night";

}


function getCurrentTime() {

    const now =
        new Date();

    return now
        .toTimeString()
        .slice(
            0,
            5
        );

}


/* ========================================
   私訊
======================================== */

let privateTimer = null;


function startPrivateMessages() {

    if (
        privateTimer !== null
    ) {

        clearTimeout(
            privateTimer
        );

    }

    if (
        !hasEnteredChat
    ) {

        return;

    }

    const delay =
        Math.floor(
            Math.random() *
            15000
        ) + 10000;

    privateTimer =
        setTimeout(
            function() {

                if (
                    !hasEnteredChat
                ) {

                    return;

                }

                showPrivateMessage();

            },
            delay
        );

}


function showPrivateMessage() {

    if (
        !hasEnteredChat
    ) {

        return;

    }

    const list =
        privateMessages[
            currentGender
        ];

    if (
        !list ||
        list.length === 0
    ) {

        return;

    }

    const randomIndex =
        Math.floor(
            Math.random() *
            list.length
        );

    const selected =
        list[
            randomIndex
        ];

    const message = {

        type:
            "private",

        user:
            selected.user,

        text:
            selected.text,

        color:
            "#c5ab9f"

    };

    addMessageToScreen(
        currentRoom,
        message
    );

    startPrivateMessages();

}


/* ========================================
   初始化輸入文字顏色
======================================== */

document
    .getElementById(
        "message-input"
    )
    .style.color =
    document
        .getElementById(
            "text-color"
        )
        .value;


</script>
