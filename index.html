<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>流光聊天室</title>

<style>


* {

    box-sizing: border-box;

    -webkit-tap-highlight-color: transparent;

}

html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    background: #080808;

    color: #ddd;

    font-family:
        "Courier New",
        "Noto Sans TC",
        monospace;

}

body {

    display: flex;

    justify-content: center;

    align-items: center;

}

button,
input,
select {

    font-family: inherit;

}

button:focus,
input:focus,
select:focus {

    outline: none;

}



#site {

    width: min(92vw, 1200px);

    aspect-ratio: 4 / 3;

    max-height: 92vh;

    background: #080808;

    border: 1px solid #333;

    position: relative;

    overflow: hidden;

}



#login-screen {

    width: 100%;
    height: 100%;

    display: flex;

    justify-content: center;
    align-items: center;

    background: #080808;

    position: relative;

}


/* ========================================
   登入視窗
======================================== */

.login-window {

    width: min(460px, 85vw);

    background:
        linear-gradient(
            135deg,
            #1a1a1a 0%,
            #111111 55%,
            #0a0a0a 100%
        );

    border: 1px solid #444;

    padding: 45px 40px;

    box-shadow:
        0 0 30px rgba(0, 0, 0, 0.8);

    position: relative;

    overflow: hidden;

}


/* ========================================
   CRT 掃描線
======================================== */

.login-window::before {

    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    background:
        repeating-linear-gradient(
            to bottom,
            rgba(255, 255, 255, 0.02) 0px,
            rgba(255, 255, 255, 0.02) 1px,
            transparent 1px,
            transparent 4px
        );

    z-index: 10;

}


/* ========================================
   Logo
======================================== */

.logo-area {

    display: flex;

    flex-direction: column;

    align-items: center;

    margin-bottom: 42px;

    position: relative;

    z-index: 2;

}

.logo-image {

    width: 105px;
    height: 105px;

    object-fit: contain;

    display: block;

    filter:
        drop-shadow(
            2px 2px 0
            rgba(0, 168, 255, 0.25)
        )
        drop-shadow(
            -2px -1px 0
            rgba(255, 45, 170, 0.18)
        );

}

.logo {

    text-align: center;

    font-size: 22px;

    letter-spacing: 0.18em;

    color: #ddd;

    margin-top: 17px;

    font-weight: 700;

    text-shadow:
        1px 0 rgba(0, 168, 255, 0.25),
        -1px 0 rgba(255, 45, 170, 0.18);

}

.logo-sub {

    text-align: center;

    color: #777;

    font-size: 12px;

    margin-top: 7px;

}


/* ========================================
   登入標籤
======================================== */

.login-label {

    display: block;

    color: #aaa;

    font-size: 12px;

    margin-bottom: 7px;

    letter-spacing: 1px;

    position: relative;

    z-index: 2;

}


/* ========================================
   登入輸入
======================================== */

.login-input {

    width: 100%;

    height: 40px;

    padding: 8px 10px;

    background: #1a1a1a;

    border: 1px solid #555;

    color: #ddd;

    margin-bottom: 20px;

    position: relative;

    z-index: 2;

}

.login-input:focus {

    border-color: #888;

    box-shadow:
        0 0 0 2px
        rgba(255, 255, 255, 0.06);

}

.login-input option {

    background: #1a1a1a;

    color: #ddd;

}


/* ========================================
   登入按鈕
======================================== */

.login-button,
.guest-button {

    width: 100%;

    height: 40px;

    cursor: pointer;

    position: relative;

    z-index: 2;

    font-weight: 600;

}

.login-button {

    background:
        linear-gradient(
            180deg,
            #333333,
            #1a1a1a
        );

    color: #ddd;

    border: 1px solid #666;

    box-shadow:
        3px 3px 0 #222;

}

.login-button:active {

    transform: translate(2px, 2px);

    box-shadow:
        1px 1px 0 #222;

}

.guest-button {

    margin-top: 12px;

    background:
        linear-gradient(
            180deg,
            #2a2a2a,
            #151515
        );

    color: #aaa;

    border: 1px solid #555;

    box-shadow:
        2px 2px 0 #333;

}

.guest-button:active {

    transform: translate(1px, 1px);

    box-shadow:
        1px 1px 0 #333;

}


/* ========================================
   登入分隔
======================================== */

.login-divider {

    display: flex;

    align-items: center;

    gap: 10px;

    margin: 28px 0;

    position: relative;

    z-index: 2;

}

.login-divider::before,
.login-divider::after {

    content: "";

    flex: 1;

    height: 1px;

    background: #555;

}

.login-divider span {

    color: #666;

    font-size: 11px;

    white-space: nowrap;

}


/* ========================================
   登入提示
======================================== */

.login-notice {

    margin-top: 25px;

    padding-top: 15px;

    border-top: 1px solid #333;

    text-align: center;

    color: #666;

    font-size: 11px;

    position: relative;

    z-index: 2;

}


#guest-name-window {

    display: none;

}


/* ========================================
   聊天室
======================================== */

#chat-screen {

    display: none;

    width: 100%;
    height: 100%;

    flex-direction: column;

    background: #080808;

    color: #ddd;

}


/* ========================================
   上方
======================================== */

.top-bar {

    height: 55px;

    flex-shrink: 0;

    border-bottom: 1px solid #333;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 18px;

    background: #0d0d0d;

}

.top-logo {

    display: flex;
    align-items: center;

}

.top-logo-image {

    height: 36px;
    width: auto;
    display: block;
    object-fit: contain;

}

.top-right {
    display: flex;
    align-items: center;
    gap: 16px;
}

.room-selector {
    display: flex;
    align-items: center;
    gap: 8px;
}

.room-selector label {
    color: #888;
    font-size: 11px;
    font-weight: 600;
}

.room-selector select {
    background: #111;
    border: 1px solid #444;
    color: #ddd;
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
}

.room-selector select:focus {
    border-color: #777;
}


/* ========================================
   主體
======================================== */

.chat-layout {

    flex: 1;

    min-height: 0;

    display: flex;

}

.chat-main {

    flex: 1;

    min-width: 0;

    min-height: 0;

    display: flex;

    flex-direction: column;

    border-right: 1px solid #333;

}


/* ========================================
   訊息區
======================================== */

.messages {

    flex: 1;

    min-height: 0;

    overflow-y: auto;

    overflow-x: hidden;

    padding: 18px;

    -webkit-overflow-scrolling: touch;

    overscroll-behavior: contain;

    background: #0a0a0a;

}

.message {

    margin-bottom: 17px;

    line-height: 1.65;

    font-weight: 600;

}

.message-meta {

    font-size: 12px;

    color: #fff;

    margin-bottom: 3px;

    font-weight: 600;

    display: flex;

    align-items: center;

    gap: 4px;

}

.message-user {

    color: #fff;

    font-weight: 600;

}

.message-target-word {

    color: #a98bea;

    font-weight: 600;

}

.message-target-name {

    color: #fff;

    font-weight: 600;

}

.message-text {

    font-size: 14px;

    word-break: break-word;

    font-weight: 600;

}

.message-time {

    color: #666;

    font-size: 10px;

    font-weight: normal;

    margin-left: 6px;

    white-space: nowrap;
}

.message-admin-gif {
    width: 18px;
    height: 18px;
    object-fit: contain;
    flex-shrink: 0;
    margin-right: 2px;
    vertical-align: middle;
}

/* 悄悄話專用樣式 */
.whisper-label {
    font-weight: bold;
    color: #ff6b6b;
}

.whisper-arrow {
    color: #888;
    margin: 0 4px;
}

.whisper-target {
    color: #fff;
}

.welcome-name {

    color: #fff;

    text-decoration: underline;

    text-underline-offset: 2px;
}

.welcome-text {

    color: #888;
}

.message-private {

    color: #c5ab9f;

    font-weight: 600;

}

.message-system {

    color: #66cc66;

    font-size: 12px;

    text-align: center;

    font-weight: normal;

    margin: 10px 0;

}

/* ========================================
   輸入區
======================================== */

.input-area {

    flex-shrink: 0;

    border-top: 1px solid #333;

    padding: 10px;

    background: #0d0d0d;

}

.tools {

    display: flex;

    align-items: center;

    gap: 6px;

    margin-bottom: 8px;

    flex-wrap: wrap;

}

.tool-button {

    width: 34px;

    height: 28px;

    background: #111;

    border: 1px solid #444;

    color: #aaa;

    cursor: pointer;

    font-weight: 600;

}

.tool-button:hover {

    background: #1a1a1a;

}

.color-label {

    color: #aaa;

    font-size: 11px;

    margin-left: 5px;

    white-space: nowrap;

}

.color-select {

    height: 28px;

    max-width: 150px;

    background: #111;

    border: 1px solid #444;

    color: #ddd;

    padding: 0 5px;

    font-weight: 600;

}

.whisper-label-input {
    color: #aaa;
    font-size: 11px;
    white-space: nowrap;
}

.whisper-target-input {
    height: 28px;
    width: 80px;
    background: #111;
    border: 1px solid #444;
    color: #ddd;
    padding: 0 5px;
    font-size: 11px;
    font-weight: 600;
    border-radius: 3px;
}

.whisper-target-input:focus {
    border-color: #ff6b6b;
}

.whisper-target-input.active {
    border-color: #ff6b6b;
    box-shadow: 0 0 6px rgba(255, 107, 107, 0.2);
}

.whisper-clear-btn {
    height: 28px;
    background: #1a1a1a;
    border: 1px solid #444;
    color: #666;
    padding: 0 8px;
    border-radius: 3px;
    cursor: pointer;
    font-size: 11px;
}

.whisper-clear-btn:hover {
    color: #aaa;
    border-color: #666;
}

.input-row {

    display: flex;

    gap: 8px;

}

.message-input {

    flex: 1;

    min-width: 0;

    height: 42px;

    background: #050505;

    border: 1px solid #444;

    padding: 8px 10px;

    color: #ffd84d;

    font-size: 14px;

    font-weight: 600;

}

.message-input:focus {

    border-color: #777;

}

.send-button {

    width: 80px;

    flex-shrink: 0;

    background: #1a1a1a;

    color: #ccc;

    border: 1px solid #555;

    cursor: pointer;

    font-weight: 600;

}

.send-button:hover {

    background: #252525;

}


/* ========================================
   成員區
======================================== */

.member-panel {

    width: 230px;

    flex-shrink: 0;

    display: flex;

    flex-direction: column;

    min-height: 0;

    background: #0d0d0d;

}


/* ========================================
   管理員
======================================== */

.admin-panel {

    flex-shrink: 0;

    border-bottom: 1px solid #333;

    padding: 10px 12px;

}

.admin-title {

    color: #555;

    font-size: 10px;

    margin-bottom: 8px;

}

.admin-member {

    display: flex;

    align-items: center;

    gap: 8px;

    padding: 5px 3px;

    font-size: 12px;

    font-weight: 600;

}

.admin-gif {

    width: 18px;
    height: 18px;
    object-fit: contain;
    flex-shrink: 0;

}

.admin-name {

    color: #fff;

}

.admin-name.offline {

    color: #555;

}


/* ========================================
   成員標題
======================================== */

.member-header {

    height: 55px;

    flex-shrink: 0;

    border-bottom: 1px solid #333;

    display: flex;

    align-items: center;

    padding: 0 15px;

    color: #888;

    font-size: 12px;

    font-weight: 600;

}

.member-list {

    flex: 1;

    min-height: 0;

    overflow-y: auto;

    padding: 12px;

}

.member-group {

    margin-bottom: 20px;

}

.member-group-title {

    color: #555;

    font-size: 10px;

    margin-bottom: 8px;

}

.member {

    display: flex;

    align-items: center;

    gap: 8px;

    padding: 6px 4px;

    font-size: 12px;

    color: #ddd;

    cursor: pointer;

    font-weight: 600;

}

.member:hover {

    background: #151515;

}

.status-dot {

    width: 7px;

    height: 7px;

    flex-shrink: 0;

    border-radius: 50%;

    border: 1px solid #555;

}

.status-online {

    background: #66cc66;

}

.status-offline {

    background: transparent;

}


/* ========================================
   捲軸
======================================== */

::-webkit-scrollbar {

    width: 7px;

    height: 7px;

}

::-webkit-scrollbar-track {

    background: #080808;

}

::-webkit-scrollbar-thumb {

    background: #333;

}

::-webkit-scrollbar-thumb:hover {

    background: #444;

}


/* ========================================
   手機版
======================================== */

@media (max-width: 700px) {

    html,
    body {

        width: 100%;

        height: 100%;

        min-height: 100%;

    }

    body {

        display: block;

        overflow: hidden;

    }

    #site {

        width: 100%;

        height: 100dvh;

        min-height: 100dvh;

        max-height: none;

        aspect-ratio: auto;

        border: none;

        overflow: hidden;

    }

    .chat-layout {

        flex: 1;

        min-height: 0;

        height: calc(
            100dvh - 55px
        );

        flex-direction: row;

    }

    .chat-main {

        flex: 3;

        min-height: 0;

        height: auto;

        border-right: 1px solid #333;

    }

    .messages {

        flex: 1;

        min-height: 0;

        overflow-y: auto;

        overflow-x: hidden;

        padding: 12px;

        -webkit-overflow-scrolling: touch;

        overscroll-behavior: contain;

    }

    .input-area {

        flex-shrink: 0;

        padding:
            7px
            8px
            calc(
                7px +
                env(
                    safe-area-inset-bottom
                )
            );

    }

    .tools {

        overflow-x: auto;

        white-space: nowrap;

        scrollbar-width: none;

        margin-bottom: 7px;

    }

    .tools::-webkit-scrollbar {

        display: none;

    }

    .tool-button {

        flex-shrink: 0;

    }

    .color-label {

        flex-shrink: 0;

    }

    .color-select {

        flex-shrink: 0;

        max-width: 140px;

    }

    .whisper-label-input {
        flex-shrink: 0;
        font-size: 10px;
    }

    .whisper-target-input {
        flex-shrink: 0;
        width: 60px;
        font-size: 10px;
    }

    .whisper-clear-btn {
        flex-shrink: 0;
        font-size: 10px;
        padding: 0 5px;
    }

    .message-input {

        height: 40px;

        font-size: 14px;

    }

    .send-button {

        width: 60px;

        height: 40px;

    }

    .member-panel {

        width: 140px;

        flex-shrink: 0;

        height: auto;

        border-top: none;

        border-left: 1px solid #333;

    }

    .admin-panel {

        height: auto;

        padding: 6px 8px;

        overflow: visible;

        white-space: normal;

        display: block;

    }

    .admin-title {

        margin-bottom: 4px;

        font-size: 9px;

    }

    .admin-member {

        display: flex;

        padding: 3px 2px;

        font-size: 10px;

        gap: 5px;

    }

    .admin-gif {

        width: 14px;

        height: 14px;

    }

    .member-header {

        height: 28px;

        flex-shrink: 0;

        padding: 0 8px;

        font-size: 10px;

    }

    .member-list {

        height: auto;

        flex: 1;

        display: block;

        padding: 6px 8px;

        overflow-y: auto;

        overflow-x: hidden;

        white-space: normal;

        scrollbar-width: thin;

    }

    .member-list::-webkit-scrollbar {

        display: block;

        width: 4px;

    }

    .member-group {

        display: block;

        margin: 0 0 8px 0;

    }

    .member-group-title {

        display: block;

        font-size: 8px;

    }

    .member {

        display: flex;

        flex-shrink: 0;

        padding: 4px 3px;

        height: auto;

        font-size: 10px;

        gap: 5px;

    }

    .status-dot {

        width: 5px;

        height: 5px;

    }

    .login-window {

        width: 86vw;

        max-width: 460px;

        padding: 35px 28px;

    }

    .logo-image {

        width: 80px;

        height: 80px;

    }

    .logo {

        font-size: 18px;

    }

    .top-logo-image {
        height: 28px;
    }

    .top-right {
        gap: 8px;
    }

    .room-selector label {
        font-size: 10px;
    }

    .room-selector select {
        font-size: 11px;
        padding: 3px 6px;
    }

}


/* ========================================
   更窄手機
======================================== */

@media (max-width: 450px) {

    .message {

        margin-bottom: 12px;

    }

    .message-text {

        font-size: 13px;

    }

    .message-time {
        font-size: 9px;
    }

    .message-meta {

        font-size: 11px;

    }

    .input-area {

        padding-left: 6px;

        padding-right: 6px;

    }

    .color-label {

        font-size: 10px;

    }

    .color-select {

        max-width: 110px;

        font-size: 10px;

    }

    .whisper-label-input {
        font-size: 9px;
    }

    .whisper-target-input {
        width: 50px;
        font-size: 9px;
    }

    .whisper-clear-btn {
        font-size: 9px;
        padding: 0 4px;
    }

    .send-button {

        width: 55px;

    }

    .login-window {

        padding:
            30px
            22px;

    }

    .member-panel {
        width: 110px;
    }

    .top-right {
        gap: 5px;
    }

    .room-selector label {
        font-size: 9px;
    }

    .room-selector select {
        font-size: 10px;
        padding: 2px 5px;
    }

}

</style>

</head>


<body>


<div id="site">


<!-- ========================================
     登入
======================================== -->

<div id="login-screen">


    <div
        class="login-window"
        id="login-main"
    >

        <div class="logo-area">

            <img
                class="logo-image"
                src="https://raw.githubusercontent.com/shelly49311-source/-/refs/heads/main/%E7%84%A1%E6%A8%99%E9%A1%8C12_20260826175005.png"
                alt="流光聊天室"
            >

            <div class="logo">
                -流光聊天室-
            </div>

        </div>


        <label class="login-label">
            帳號
        </label>


        <input
            class="login-input"
            id="login-account"
            type="text"
        >


        <label class="login-label">
            密碼
        </label>


        <input
            class="login-input"
            id="login-password"
            type="password"
        >


        <button
            class="login-button"
            onclick="loginUnavailable()"
        >
            登入
        </button>


        <div class="login-divider">

            <span>
                ── 或 ──
            </span>

        </div>


        <button
            class="guest-button"
            onclick="showGuestLogin()"
        >
            訪客登入
        </button>


        <div class="login-notice">
            目前暫不開放註冊
        </div>


    </div>


    <!-- ====================================
         訪客登入（已移除性別選項）
    ==================================== -->

    <div
        class="login-window"
        id="guest-name-window"
    >

        <div class="logo-area">

            <img
                class="logo-image"
                src="https://raw.githubusercontent.com/shelly49311-source/-/refs/heads/main/%E7%84%A1%E6%A8%99%E9%A1%8C12_20260826175005.png"
                alt="流光聊天室"
            >

            <div class="logo">
                -流光聊天室-
            </div>

        </div>


        <label class="login-label">
            請輸入你的名稱
        </label>


        <input
            class="login-input"
            id="guest-name"
            type="text"
            maxlength="20"
            placeholder="輸入名稱"
        >


        <button
            class="login-button"
            onclick="enterGuest()"
        >
            進入
        </button>


        <button
            class="guest-button"
            onclick="backToLogin()"
        >
            返回
        </button>


    </div>


</div>


<!-- ========================================
     聊天室
======================================== -->

<div id="chat-screen">


    <div class="top-bar">

        <div class="top-logo">
            <img
                class="top-logo-image"
                src="https://raw.githubusercontent.com/shelly49311-source/-/refs/heads/main/%E7%84%A1%E6%A8%99%E9%A1%8C12_20260826175005.png"
                alt="流光聊天室"
            >
        </div>

        <div class="top-right">

            <div class="room-selector">
                <label for="roomSelect">選擇聊天室</label>
                <select id="roomSelect">
                    <option value="1">日不落</option>
                    <option value="2">夜不息</option>
                    <option value="3">人不孤</option>
                </select>

function enterGuest() {

    const nameInput =
        document.getElementById(
            "guest-name"
        );

    const name =
        nameInput.value.trim();

    if (name === "") {

        alert(
            "請輸入名稱。"
        );

        return;

    }

    currentUser = "訪客_" + name;

    hasEnteredChat = true;

    document.getElementById(
        "login-screen"
    ).style.display = "none";

    document.getElementById(
        "chat-screen"
    ).style.display = "flex";

    initializeRooms();

    const welcomeMessage = {
        type: "system",
        welcome: true,
        user: currentUser,
        time: getCurrentTime()
    };

    addMessageToScreen(
        currentRoom,
        welcomeMessage
    );

}



function initializeRooms() {

    currentRoom = 1;

    for (
        let roomNumber = 1;
        roomNumber <= 3;
        roomNumber++
    ) {

        roomMessages[roomNumber] = [];

        shownAutomaticMessages[
            roomNumber
        ].clear();

        onlineVisitors[roomNumber] = [];

        if (visitorTimers[roomNumber] !== null) {
            clearTimeout(visitorTimers[roomNumber]);
            visitorTimers[roomNumber] = null;
        }

    }

    if (visitors[1] && visitors[1].length > 0) {
        const shuffled = [...visitors[1]].sort(() => Math.random() - 0.5);
        const presetCount = Math.min(
            Math.floor(Math.random() * 8) + 8,
            shuffled.length
        );
        for (let i = 0; i < presetCount; i++) {
            onlineVisitors[1].push(shuffled[i]);
        }
    }

    document.getElementById("roomSelect").value = "1";

    renderRoom();

    renderMembers();

    if (
        hasEnteredChat
    ) {

        startLiveChat();

        startVisitorMovement(1);

        setTimeout(
            function() {
                triggerPlayerEnterGreeting();
            },
            Math.floor(Math.random() * 2000) + 3000
        );


        startScammerSystem();

    }

}



function renderRoom() {

    const room =
        rooms[currentRoom];

    const container =
        document.getElementById(
            "messages"
        );

    container.innerHTML = "";

    const messages =
        roomMessages[
            currentRoom
        ];

    messages.forEach(
        message => {

            const element =
                createMessageElement(
                    message
                );

            container.appendChild(
                element
            );

        }
    );

    container.scrollTop =
        container.scrollHeight;

    // 更新下拉選單的選取狀態
    document.getElementById("roomSelect").value = String(currentRoom);

}



function createMessageElement(
    message
) {

    const element =
        document.createElement(
            "div"
        );

    element.className =
        "message";

    const meta =
        document.createElement(
            "div"
        );

    meta.className =
        "message-meta";

    const text =
        document.createElement(
            "div"
        );

    text.className =
        "message-text";

    const currentAdmins = administrators[currentRoom] || [];
    const isAdmin = currentAdmins.some(admin => admin.name === message.user && admin.online === true);

    if (message.whisper && message.target) {

        const isSender = message.user === currentUser;
        const isReceiver = message.target === currentUser || message.target === message.user;

        if (isSender || isReceiver) {

            const whisperLabel =
                document.createElement("span");

            whisperLabel.className =
                "whisper-label";

            whisperLabel.textContent =
                "【悄悄話】";

            meta.appendChild(
                whisperLabel
            );

            // 如果是在線管理員，在名字前面加上 GIF 和 【管理員】
            if (isAdmin) {
                const gif =
                    document.createElement("img");
                gif.className = "message-admin-gif";
                gif.src = adminGif;
                gif.alt = "";
                meta.appendChild(gif);
                const adminLabel =
                    document.createElement("span");
                adminLabel.style.color = "#ffd84d";
                adminLabel.style.fontWeight = "bold";
                adminLabel.textContent = "【管理員】";
                meta.appendChild(adminLabel);
            }

            // 發送者
            const sender =
                document.createElement("span");

            sender.className =
                "message-user";

            sender.textContent =
                message.user;

            meta.appendChild(
                sender
            );

            // 箭頭
            const arrow =
                document.createElement("span");

            arrow.className =
                "whisper-arrow";

            arrow.textContent =
                " → ";

            meta.appendChild(
                arrow
            );

            // 接收者
            const target =
                document.createElement("span");

            target.className =
                "whisper-target";

            // 如果是玩家自己，顯示「你」
            if (message.target === currentUser) {
                target.textContent = "你";
            } else {
                target.textContent = message.target;
            }

            meta.appendChild(
                target
            );

            // 冒號
            const colon =
                document.createTextNode(
                    "："
                );

            meta.appendChild(
                colon
            );

            // 訊息內容
            text.textContent =
                message.text;

            text.style.color =
                message.color ||
                "#ddd";

            const time =
                document.createElement("span");

            time.className =
                "message-time";

            time.textContent =
                `(${message.time || getCurrentTime()})`;

            text.appendChild(time);

            element.appendChild(
                meta
            );

            element.appendChild(
                text
            );

            return element;

        } else {

            const hidden =
                document.createElement("div");

            hidden.style.display =
                "none";

            return hidden;

        }

    }



    if (message.type === "system") {

        element.className =
            "message message-system";

        if (message.welcome) {

            const welcomeName =
                document.createElement("span");

            welcomeName.className =
                "welcome-name";

            welcomeName.textContent =
                message.user;

            const welcomeMessage =
                document.createElement("span");

            welcomeMessage.className =
                "welcome-text";

            welcomeMessage.textContent =
                " 歡迎進入聊天室";

            const time =
                document.createElement("span");

            time.className =
                "message-time";

            time.textContent =
                `(${message.time})`;

            element.appendChild(welcomeName);
            element.appendChild(welcomeMessage);
            element.appendChild(time);

        } else {

            text.textContent =
                message.text;

            text.style.color =
                "#888";

            element.appendChild(text);

        }

        return element;
    }

    if (
        message.type ===
        "private"
    ) {

        meta.className =
            "message-meta message-private";

        meta.textContent =
            message.user +
            " 私訊：";

    }

    else if (
        message.from &&
        message.to
    ) {

        // 如果是在線管理員，在名字前面加上 GIF
        if (isAdmin) {
            const gif =
                document.createElement("img");
            gif.className = "message-admin-gif";
            gif.src = adminGif;
            gif.alt = "";
            meta.appendChild(gif);
        }

        const from =
            document.createElement(
                "span"
            );

        from.className =
            "message-user";

        if (isAdmin) {
            const adminLabel =
                document.createElement("span");
            adminLabel.style.color = "#ffd84d";
            adminLabel.style.fontWeight = "bold";
            adminLabel.textContent = "【管理員】";
            meta.appendChild(adminLabel);
        }

        from.textContent =
            message.from;

        const targetWord =
            document.createElement(
                "span"
            );

        targetWord.className =
            "message-target-word";

        targetWord.textContent =
            " → ";

        const targetName =
            document.createElement(
                "span"
            );

        targetName.className =
            "message-target-name";

        targetName.textContent =
            message.to;

        meta.appendChild(
            from
        );

        meta.appendChild(
            targetWord
        );

        meta.appendChild(
            targetName
        );

        const colon =
            document.createTextNode(
                "："
            );

        meta.appendChild(
            colon
        );

    }

    else {

        if (isAdmin) {
            const gif =
                document.createElement("img");
            gif.className = "message-admin-gif";
            gif.src = adminGif;
            gif.alt = "";
            meta.appendChild(gif);
        }

        const user =
            document.createElement(
                "span"
            );

        user.className =
            "message-user";

        if (isAdmin) {
            const adminLabel =
                document.createElement("span");
            adminLabel.style.color = "#ffd84d";
            adminLabel.style.fontWeight = "bold";
            adminLabel.textContent = "【管理員】";
            meta.appendChild(adminLabel);
        }

        user.textContent =
            message.user;

        meta.appendChild(
            user
        );

        const colon =
            document.createTextNode(
                "："
            );

        meta.appendChild(
            colon
        );

    }

    text.textContent =
        message.text;

    text.style.color =
        message.color ||
        "#ddd";

    const time =
        document.createElement("span");

    time.className =
        "message-time";

    time.textContent =
        `(${message.time || getCurrentTime()})`;

    text.appendChild(time);

    element.appendChild(
        meta
    );

    element.appendChild(
        text
    );

    return element;

}



function addMessageToScreen(
    roomNumber,
    message,
    save = true
) {

    if (!message.time) {
        message.time = getCurrentTime();
    }

    if (
        save
    ) {

        roomMessages[
            roomNumber
        ].push(
            message
        );

    }

    if (
        roomNumber !==
        currentRoom
    ) {

        return;

    }

    const container =
        document.getElementById(
            "messages"
        );

    const element =
        createMessageElement(
            message
        );

    container.appendChild(
        element
    );

    
    const isAtBottom =
        container.scrollHeight -
        container.scrollTop -
        container.clientHeight < 100;

    if (isAtBottom) {
        container.scrollTop =
            container.scrollHeight;
    }

}



document.getElementById("roomSelect").addEventListener("change", function() {

    const roomNumber = parseInt(this.value);

    if (roomNumber === currentRoom) {
        return;
    }

    currentRoom = roomNumber;

    renderRoom();

    renderMembers();

    // 切換房間後顯示歡迎訊息
    const welcomeMessage = {
        type: "system",
        welcome: true,
        user: currentUser,
        time: getCurrentTime()
    };

    addMessageToScreen(
        currentRoom,
        welcomeMessage
    );

    // 切換房間後強制觸發一次自動聊天
    if (hasEnteredChat) {
        if (liveChatTimer !== null) {
            clearTimeout(liveChatTimer);
            liveChatTimer = null;
        }
        scheduleNextMessage();
    }

    if (roomNumber === 1) {
        setTimeout(
            function() {
                triggerPlayerEnterGreeting();
            },
            Math.floor(Math.random() * 2000) + 3000
        );
    }

});

/* ========================================
   成員（包含線上訪客 + 玩家本人）
======================================== */

function renderMembers() {

    renderAdministrators();

    const list =
        document.getElementById(
            "member-list"
        );

    list.innerHTML = "";

    const adminNames = new Set(
        (administrators[currentRoom] || []).map(
            admin => admin.name
        )
    );

    const memberNames = (rooms[currentRoom]?.members || [])
        .filter(member => member[1] === true)
        .map(member => member[0])
        .filter(name => !adminNames.has(name));

    const visitorNames = onlineVisitors[currentRoom] || [];

    const allNames = [];

    // 1. 先放會員
    memberNames.forEach(name => {
        if (!allNames.includes(name)) {
            allNames.push(name);
        }
    });

    // 2. 再放玩家（固定在會員下面、訪客上面）
    if (currentUser && !allNames.includes(currentUser)) {
        allNames.push(currentUser);
    }

    // 3. 最後放訪客（按進入順序，排在玩家下面）
    visitorNames.forEach(name => {
        const visitorName = "訪客_" + name;
        if (!allNames.includes(visitorName)) {
            allNames.push(visitorName);
        }
    });

    if (allNames.length === 0) {
        const emptyMsg =
            document.createElement("div");

        emptyMsg.style.color = "#555";
        emptyMsg.style.fontSize = "11px";
        emptyMsg.style.padding = "8px 4px";
        emptyMsg.textContent = "目前沒有在線成員";

        list.appendChild(emptyMsg);
        return;
    }

    allNames.forEach(name => {

        const member =
            document.createElement("div");

        member.className = "member";

        const dot =
            document.createElement("span");

        dot.className =
            "status-dot status-online";

        const nameElement =
            document.createElement("span");

        nameElement.textContent = name;
        nameElement.style.color = "#ddd";

        member.appendChild(dot);
        member.appendChild(nameElement);

        // 點擊成員名稱自動填入悄悄話對象
        member.addEventListener(
            "click",
            function() {
                const targetInput =
                    document.getElementById(
                        "whisper-target"
                    );
                let targetName = name;
                if (name.startsWith("訪客_")) {
                    targetName = name;
                }
                targetInput.value = targetName;
                targetInput.classList.add("active");
                targetInput.style.borderColor = "#ff6b6b";
                document.getElementById(
                    "message-input"
                ).placeholder = `對 ${targetName} 說悄悄話……`;
                targetInput.focus();
            }
        );

        list.appendChild(member);

    });

}

function sendMessage() {

    const input =
        document.getElementById(
            "message-input"
        );

    const messageText =
        input.value.trim();

    if (
        messageText === ""
    ) {

        return;

    }

    const color =
        document
            .getElementById(
                "text-color"
            )
            .value;

    // 檢查是否有悄悄話對象
    const target =
        document.getElementById(
            "whisper-target"
        ).value.trim();

    if (target !== "") {

        // 發送悄悄話
        const whisperMessage = {

            user:
                currentUser,

            text:
                messageText,

            color:
                color,

            target:
                target,

            whisper:
                true

        };

        addMessageToScreen(
            currentRoom,
            whisperMessage
        );

        // 不清除對象欄，方便連續發送

    } else {

        // 發送一般訊息
        const playerMessage = {

            user:
                currentUser,

            text:
                messageText,

            color:
                color

        };

        addMessageToScreen(
            currentRoom,
            playerMessage
        );

        // 觸發 NPC 回應（僅限 01，70% 機率）
        if (currentRoom === 1 && Math.random() < 0.7) {
            triggerNPCResponse(messageText);
        }

    }

    input.value = "";

    input.focus();

}

let liveChatTimer = null;


function startLiveChat() {

    if (
        liveChatTimer !== null
    ) {

        clearTimeout(
            liveChatTimer
        );

    }

    if (
        !hasEnteredChat
    ) {

        return;

    }

    scheduleNextMessage();

}


function scheduleNextMessage() {

    if (
        !hasEnteredChat
    ) {

        return;

    }

    
    const delay =
        Math.floor(
            Math.random() *
            12000
        ) + 8000;

    liveChatTimer =
        setTimeout(
            function() {

                if (
                    !hasEnteredChat
                ) {

                    return;

                }

                addAutomaticMessage();

                scheduleNextMessage();

            },
            delay
        );

}



function getChatDatabasePeriod() {

    const hour =
        new Date().getHours();

    if (
        hour >= 6 &&
        hour < 9
    ) {

        return "morning";

    }

    if (
        hour >= 9 &&
        hour < 12
    ) {

        return "day";

    }

    if (
        hour >= 12 &&
        hour < 14
    ) {

        return "noon";

    }

    if (
        hour >= 14 &&
        hour < 20
    ) {

        return "afternoon";

    }

    if (
        hour >= 20 &&
        hour < 23
    ) {

        return "evening";

    }

    if (
        hour >= 23 ||
        hour < 3
    ) {

        return "late";

    }

    return "dead";

}



function playChatFragment(
    fragment
) {

    if (
        !fragment ||
        !fragment.lines ||
        fragment.lines.length === 0
    ) {

        return;

    }

    // 記錄開始播放時的房間號
    const playingRoom = currentRoom;

    let index = 0;

    function nextLine() {

        // 如果房間已經切換，停止播放
        if (currentRoom !== playingRoom) {
            return;
        }

        if (
            index >=
            fragment.lines.length
        ) {

            return;

        }

        const line =
            fragment.lines[
                index
            ];

        // 建立 message 物件時，user 永遠是 line.speaker
        const message = {

            user:
                line.speaker,

            text:
                line.text,

            color:
                getNPCColor(
                    line.speaker
                )

        };

        if (line.target) {
            message.from = line.speaker;
            message.to = line.target;
        }

        addMessageToScreen(
            playingRoom,
            message
        );

        index++;

        if (
            index <
            fragment.lines.length
        ) {

            // 放慢：每句間隔 3–7 秒
            const delay =
                Math.floor(
                    Math.random() *
                    4000
                ) + 3000;

            setTimeout(
                nextLine,
                delay
            );

        }

    }

    nextLine();

}



function getNPCColor(
    speaker
) {

    const colorMap = {

        "小麥": "#ffd84d",
        "阿哲": "#ffd84d",
        "檸檬汽水": "#d8899b",
        "颱風天": "#f27a3d",
        "左邊轉彎": "#b6a6d9",
        "七喜": "#ffd84d",
        "工讀生": "#7fafc4",
        "雨天": "#ffd84d",
        "MOMO": "#b6a6d9",
        "小海": "#7fafc4",
        "橘子汽水": "#f27a3d",
        "藍色星期天": "#b6a6d9",
        "阿葵": "#b6a6d9"

    };

    return (
        colorMap[
            speaker
        ] ||
        "#ddd"
    );

}



function addAutomaticMessage() {

    if (!hasEnteredChat) {
        return;
    }

    let roomFragments = [];

    if (currentRoom === 1) {
        const period = getChatDatabasePeriod();
        roomFragments = chatDatabase.filter(fragment => {
            if (fragment.room !== 1) return false;
            if (period === "morning") {
                return fragment.id.startsWith("morning");
            } else if (period === "day" || period === "noon") {
                return fragment.id.startsWith("day");
            } else if (period === "afternoon") {
                return fragment.id.startsWith("afternoon") ||
                       fragment.id.startsWith("day") ||
                       fragment.id.startsWith("evening");
            } else if (period === "evening") {
                return fragment.id.startsWith("evening") ||
                       fragment.id.startsWith("day_pet") ||
                       fragment.id.startsWith("day_daily");
            } else if (period === "late") {
                return fragment.id.startsWith("late") ||
                       fragment.id.startsWith("evening_snack") ||
                       fragment.id.startsWith("evening_life");
            } else if (period === "dead") {
                return fragment.id.startsWith("dead");
            }
            return false;
        });
    } else if (currentRoom === 2) {
        roomFragments = chatDatabaseNight;
    } else if (currentRoom === 3) {
        // 03 只有晚上才有對話
        const hour = new Date().getHours();
        if (hour >= 18 && hour < 23) {
            roomFragments = chatDatabaseOld;
        } else {
            roomFragments = [];
        }
    }

    if (roomFragments.length === 0) {
        return;
    }

    const available = roomFragments.filter(fragment => {
        return !shownAutomaticMessages[currentRoom].has(fragment.id);
    });

    if (available.length === 0) {
        return;
    }

    const randomIndex = Math.floor(Math.random() * available.length);
    const selected = available[randomIndex];
    shownAutomaticMessages[currentRoom].add(selected.id);
    playChatFragment(selected);
}



let playerGreetingCooldown = 0;

function triggerPlayerEnterGreeting() {

    if (!hasEnteredChat) return;
    if (currentRoom !== 1) return;

    const now = Date.now();
    if (now - playerGreetingCooldown < 60000) return;

    const greetings = [
        { speaker: "小麥", text: "啊 有新面孔" },
        { speaker: "檸檬汽水", text: "你好啊" },
        { speaker: "阿哲", text: "嗨" },
        { speaker: "小麥", text: "歡迎" },
        { speaker: "七喜", text: "你好" },
        { speaker: "檸檬汽水", text: "哈囉～" }
    ];

    const count = Math.random() < 0.4 ? 2 : 1;
    const shuffled = greetings.sort(() => Math.random() - 0.5);
    const selected = shuffled.slice(0, count);

    const playingRoom = currentRoom;

    selected.forEach((g, index) => {
        const delay = index * 1500 + Math.floor(Math.random() * 1000) + 1500;
        setTimeout(() => {
            if (currentRoom !== playingRoom) return;
            const message = {
                user: g.speaker,
                text: g.text,
                color: getNPCColor(g.speaker)
            };
            addMessageToScreen(playingRoom, message);
        }, delay);
    });

    playerGreetingCooldown = now;

}



let lastNPCResponseTime = 0;

function triggerNPCResponse(playerText) {

    if (!hasEnteredChat) return;
    if (currentRoom !== 1) return;

    const now = Date.now();
    if (now - lastNPCResponseTime < 8000) return;

    const lowerText = playerText.toLowerCase();

    let matchedResponse = null;

    for (const category of playerTriggerResponses) {
        for (const keyword of category.keywords) {
            if (lowerText.includes(keyword)) {
                matchedResponse = category.responses;
                break;
            }
        }
        if (matchedResponse) break;
    }

    if (!matchedResponse) {
        matchedResponse = [
            { speaker: "小麥", text: "哈哈" },
            { speaker: "阿哲", text: "嗯" },
            { speaker: "檸檬汽水", text: "真的假的" },
            { speaker: "七喜", text: "這樣啊" }
        ];
    }

    const chosen = matchedResponse[Math.floor(Math.random() * matchedResponse.length)];
    const playingRoom = currentRoom;

    const delay = Math.floor(Math.random() * 3000) + 2000;

    setTimeout(() => {
        if (currentRoom !== playingRoom) return;
        const message = {
            user: chosen.speaker,
            text: chosen.text,
            color: getNPCColor(chosen.speaker)
        };
        addMessageToScreen(playingRoom, message);
        lastNPCResponseTime = Date.now();
    }, delay);

}



let scammerTimer = null;

function startScammerSystem() {

    if (scammerTimer !== null) {
        clearTimeout(scammerTimer);
        scammerTimer = null;
    }

    scheduleScammer();

}


function scheduleScammer() {

    if (!hasEnteredChat) return;

    // 隨機間隔 60–180 秒
    const delay = Math.floor(Math.random() * 120000) + 60000;

    scammerTimer = setTimeout(
        function() {

            if (!hasEnteredChat) {
                return;
            }

            triggerScammer();
            scheduleScammer();

        },
        delay
    );

}


function triggerScammer() {

    // 從三個聊天室中隨機選一個，但 03 出現機率較低
    let roomPool = [1, 2];
    if (Math.random() < 0.2) {
        roomPool.push(3);
    }

    const targetRoom = roomPool[Math.floor(Math.random() * roomPool.length)];

    // 如果目標房間不是當前房間，就不顯示（玩家看不到）
    if (targetRoom !== currentRoom) {
        return;
    }

    // 隨機選一個詐騙訊息
    const scammer = scammerMessages[Math.floor(Math.random() * scammerMessages.length)];

    // 顯示詐騙訊息
    const scamMessage = {
        user: scammer.name,
        text: scammer.text,
        color: "#ff6b6b"
    };

    addMessageToScreen(
        targetRoom,
        scamMessage
    );

    // 2–3 秒後管理員踢出
    const delay = Math.floor(Math.random() * 1000) + 2000;

    setTimeout(
        function() {

            if (targetRoom !== currentRoom) {
                return;
            }

            // 顯示被踢出的系統訊息
            const kickMessage = {
                type: "system",
                text: scammer.name + " 已違反規定，被管理員移出聊天室。"
            };

            addMessageToScreen(
                targetRoom,
                kickMessage
            );

        },
        delay
    );

}



function getTimePeriod() {

    const hour =
        new Date().getHours();

    if (
        hour >= 6 &&
        hour < 18
    ) {

        return "day";

    }

    return "night";

}


function getCurrentTime() {

    const now =
        new Date();

    return now
        .toTimeString()
        .slice(
            0,
            5
        );

}



let privateTimer = null;


function startPrivateMessages() {

    // 私訊已停用，因為 privateMessages 已清空
    return;

}


function showPrivateMessage() {

    return;

}


function startVisitorMovement(roomNumber) {

    if (visitorTimers[roomNumber] !== null) {
        clearTimeout(visitorTimers[roomNumber]);
        visitorTimers[roomNumber] = null;
    }

    if (roomNumber !== 1) {
        return;
    }

    scheduleVisitorAction(roomNumber);

}


function scheduleVisitorAction(roomNumber) {

    if (!hasEnteredChat) {
        return;
    }

    const onlineList = onlineVisitors[roomNumber] || [];
    const allVisitors = visitors[roomNumber] || [];
    const availableToEnter = allVisitors.filter(name => !onlineList.includes(name));

    let action = "enter";
    let delay = 0;

    if (availableToEnter.length === 0) {
        action = "leave";
        delay = Math.floor(Math.random() * 8000) + 5000;
    } else if (onlineList.length === 0) {
        action = "enter";
        delay = Math.floor(Math.random() * 8000) + 4000;
    } else {
        const r = Math.random();
        if (r < 0.55) {
            action = "enter";
            delay = Math.floor(Math.random() * 20000) + 15000; // 15–35 秒
        } else {
            action = "leave";
            delay = Math.floor(Math.random() * 35000) + 25000; // 25–60 秒
        }
    }

    visitorTimers[roomNumber] = setTimeout(
        function() {

            if (!hasEnteredChat) {
                return;
            }

            if (action === "enter") {
                const count = Math.random() < 0.2 ? 3 : (Math.random() < 0.4 ? 2 : 1);
                for (let i = 0; i < count; i++) {
                    addVisitor(roomNumber);
                }
            } else {
                const count = Math.random() < 0.3 ? 2 : 1;
                for (let i = 0; i < count; i++) {
                    removeVisitor(roomNumber);
                }
            }

            scheduleVisitorAction(roomNumber);

        },
        delay
    );

}


function addVisitor(roomNumber) {

    const allVisitors = visitors[roomNumber] || [];
    const onlineList = onlineVisitors[roomNumber] || [];

    const available = allVisitors.filter(name => !onlineList.includes(name));

    if (available.length === 0) {
        return;
    }

    const randomIndex = Math.floor(Math.random() * available.length);
    const name = available[randomIndex];

    onlineVisitors[roomNumber].push(name);

    const message = {
        type: "system",
        text: "訪客_" + name + " 歡迎進入聊天室"
    };

    addMessageToScreen(
        roomNumber,
        message
    );

    if (roomNumber === currentRoom) {
        renderMembers();
    }

}


function removeVisitor(roomNumber) {

    const onlineList = onlineVisitors[roomNumber] || [];

    if (onlineList.length === 0) {
        return;
    }

    const randomIndex = Math.floor(Math.random() * onlineList.length);
    const name = onlineList[randomIndex];

    onlineVisitors[roomNumber] = onlineList.filter(n => n !== name);

    const message = {
        type: "system",
        text: "訪客_" + name + " 離開了聊天室"
    };

    addMessageToScreen(
        roomNumber,
        message
    );

    if (roomNumber === currentRoom) {
        renderMembers();
    }

}



document
